<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenFit — Live Runner Tracker</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    :root {
      --primary: #8F4C86;
      --primary-dark: #5A2A5E;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --bg-page: #F7F6F9;
      --bg-card: #FFFFFF;
      --border-card: #ECE7EE;
      --text-main: #1F1A24;
      --text-muted: #534D59;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #140E16;
        --bg-card: #201824;
        --border-card: #3D2F42;
        --text-main: #F3EEF5;
        --text-muted: #D1C5D5;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-card);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .brand-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-active {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .status-paused {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid var(--accent-amber);
    }

    .status-completed {
      background-color: rgba(143, 76, 134, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .status-expired {
      background-color: rgba(100, 116, 139, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-card);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 10;
    }

    .stats-overlay {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      max-width: 500px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .stat-item .val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-item .lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .telemetry-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-card);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .alert-banner {
      display: none;
      background: #FEF2F2;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">&hearts;</div>
    <div class="brand-text">
      <h1 id="runner-title">Runner Live Tracking</h1>
      <p id="sub-title">Outdoor Run &bull; Shared via MenFit</p>
    </div>
  </div>
  <div id="status-badge" class="status-badge status-active">
    <span class="pulse-dot"></span>
    <span id="status-label">Active</span>
  </div>
</header>

<div id="map"></div>

<div class="stats-overlay">
  <div id="alert-box" class="alert-banner">
    <span>&#9888;</span> <span id="alert-text">Runner has been stationary for over 4 minutes</span>
  </div>
  <div class="stats-grid">
    <div class="stat-item">
      <div class="val" id="stat-speed">0.0 km/h</div>
      <div class="lbl">Current Speed</div>
    </div>
    <div class="stat-item">
      <div class="val" id="stat-battery">--%</div>
      <div class="lbl">Phone Battery</div>
    </div>
    <div class="stat-item">
      <div class="val" id="stat-updated">Just now</div>
      <div class="lbl">Last Update</div>
    </div>
  </div>
  <div class="telemetry-bar">
    <span id="session-time">Started: --:--</span>
    <span id="session-expiration">Expires in: 2h</span>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  // Parse hash and query parameters
  function getParams() {
    const raw = window.location.hash.substring(1) || window.location.search.substring(1);
    const params = new URLSearchParams(raw);
    return {
      token: params.get('token') || '',
      runner: params.get('runner') || 'Runner',
      lat: parseFloat(params.get('lat')) || -33.8688,
      lng: parseFloat(params.get('lng')) || 151.2093,
      speed: parseFloat(params.get('speed')) || 9.2,
      battery: parseInt(params.get('battery')) || 82,
      status: (params.get('status') || 'active').toLowerCase()
    };
  }

  const p = getParams();

  document.getElementById('runner-title').textContent = p.runner + "'s Live Tracking";
  document.getElementById('stat-battery').textContent = p.battery + '%';
  document.getElementById('stat-speed').textContent = p.speed.toFixed(1) + ' km/h';

  // Status mapping
  const badge = document.getElementById('status-badge');
  const label = document.getElementById('status-label');
  badge.className = 'status-badge status-' + p.status;
  label.textContent = p.status.charAt(0).toUpperCase() + p.status.slice(1);

  if (p.status === 'expired' || p.status === 'cancelled') {
    document.getElementById('sub-title').textContent = 'This live-tracking link has ended or expired.';
  }

  // Initialize Leaflet Map
  const map = L.map('map', {
    center: [p.lat, p.lng],
    zoom: 15,
    zoomControl: false
  });

  L.control.zoom({ position: 'topright' }).addTo(map);

  // CartoDB Voyager Map Tiles (matching MenFit in-app styling)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  // Custom runner circle marker
  const marker = L.circleMarker([p.lat, p.lng], {
    radius: 9,
    fillColor: '#8F4C86',
    color: '#FFFFFF',
    weight: 3,
    opacity: 1,
    fillOpacity: 0.95
  }).addTo(map);

  // Pulsing accuracy halo
  L.circle([p.lat, p.lng], {
    radius: 25,
    color: '#8F4C86',
    weight: 1,
    opacity: 0.4,
    fillColor: '#8F4C86',
    fillOpacity: 0.1
  }).addTo(map);

  // Simulated breadcrumb trail for visualization
  const route = [
    [p.lat - 0.003, p.lng - 0.004],
    [p.lat - 0.002, p.lng - 0.002],
    [p.lat - 0.001, p.lng - 0.0005],
    [p.lat, p.lng]
  ];
  L.polyline(route, { color: '#8F4C86', weight: 4, opacity: 0.7, dashArray: '6, 6' }).addTo(map);

  let seconds = 0;
  setInterval(() => {
    seconds += 5;
    if (seconds < 60) {
      document.getElementById('stat-updated').textContent = seconds + 's ago';
    } else {
      document.getElementById('stat-updated').textContent = Math.floor(seconds / 60) + 'm ago';
    }
  }, 5000);
</script>
</body>
</html>
