org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation caches (*.tab) get held open on Windows -
# builds fail with "Could not close incremental caches ... class-fq-name-to
# -source.tab". Real-time antivirus scanning is the usual culprit and this
# machine runs Avast (see knowledge/troubleshooting/android_build.md).
# Costs a full recompile of the plugin modules each build; correctness beats
# a build that cannot finish.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Added by the Flutter template as a deliberate, temporary bypass: AGP 9
# made built-in Kotlin the default, and this pair opts back out of it.
#
# It is why the build warns "Your app uses the following plugins that apply
# Kotlin Gradle Plugin (KGP): mobile_scanner" — that plugin applies
# `kotlin-android` ONLY when this is false (its build.gradle reads
# `agpMajor >= 9 && android.builtInKotlin`), so the warning is produced by
# this setting, not by anything wrong with the plugin.
#
# MEASURED 2026-08-27: flipping this to `true` does NOT fix it - the build
# fails with "Applying the Kotlin Android Plugin (KGP) was unsuccessful. KGP
# was not found on the classpath" and "'kotlin-android' plugin requires one
# of the Android Gradle plugins". Migrating properly means moving the app
# module to built-in Kotlin AND every plugin in the tree supporting it, which
# is not the case yet. Do not re-attempt the one-line flip; re-check when
# Flutter's migration guide says plugins have caught up:
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
