name: menfit_app
description: "Men's strength-first training and nutrition app."
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: 6.8.1
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.1.2
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.12
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.2
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.5.0
  google_mlkit_text_recognition: 0.17.1
  health: 13.3.2
  image_picker: 1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  meta: ^1.19.0
  mobile_scanner: 7.4.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  share_plus: 13.3.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  wakelock_plus: 1.8.0
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.8
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
